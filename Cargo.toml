[package]
name = "serial-tui"
version = "0.1.0"
edition = "2021"
description = "TUI 串口调试助手"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
anyhow = "1"

[dev-dependencies]
insta = "1"